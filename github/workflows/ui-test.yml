name: UI Tests

on:
    workflow_dispatch:

jobs:
  test-chrome:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt

      - run: pytest tests/test_login.py --browser=Chrome --headless